<form name="{{ .Title | lower }}-submission"{{ if .Params.formspree_form_id }} action="https://formspree.io/f/{{ .Params.formspree_form_id }}"{{ end }} method="post" accept-charset="utf-8">
  <fieldset id="{{ .Title | lower }}-inputs">
    <legend>{{ .Params.Name }}</legend>
    <label for="full-name">{{ T "contact_name_label" }}</label>
    <input type="text" name="name" id="full-name" placeholder="{{ T "contact_name_placeholder" }}" required>
    <label for="email-address">{{ T "contact_email_label" }}</label>
    <input type="email" name="_replyto" id="email-address" placeholder="{{ T "contact_email_placeholder" }}" required>
    <label for="message">{{ T "contact_message_label" }}</label>
    <textarea rows="6" name="message" id="message" placeholder="{{ T "contact_message_placeholder" }}" required></textarea>
    <input type="hidden" name="_subject" id="email-subject" value="{{ .Params.Name | title }} {{ T "contact_form_submission" }}" />
  </fieldset>
  <input type="submit" value="{{ if .Params.submit_button_label }}{{ .Params.submit_button_label }}{{ end }}">
  {{ if .Params.show_poweredby_formspree }}<small class="db dib-l ml4-l">{{ T "powered_by" }} <a href="https://formspree.io" target="_blank">Formspree</a></small>{{ end }}
</form>
