{{ define "main" }}
<main class="page-main pa4" role="main">
  <section class="page-content mw8 center">
    {{ if .Params.show_title_as_headline }}<h1 class="f2 f1-m f-headline-l fw5-ns mv4 mb2 lh-solid tracked-tight-ns">{{ .Title }}</h1>{{ end }}
    {{ with .Params.subtitle }}<p class="f4 measure-wide lh-copy mid-gray mt0 mb4">{{ . }}</p>{{ end }}
    {{ .Content }}
  </section>
</main>
{{ end }}
